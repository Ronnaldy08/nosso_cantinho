<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nosso Cantinho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- TELA 1: CAPA -->
  <section id="tela-capa" class="tela ativa">
    <div class="capa">
      <span class="enfeite e1">✿</span>
      <span class="enfeite e2">✦</span>
      <span class="enfeite e3">❀</span>
      <span class="enfeite e4">✦</span>
      <p class="capa-data">16 · 11 · 2026</p>
      <h1 class="capa-frase">Fiz um cantinho para guardar um pouquinho de nós, minha princesa.</h1>
      <button id="btn-abrir" class="botao" type="button">Abrir o presente</button>
    </div>
  </section>

  <!-- TELA 2: ESCOLHA DA MÚSICA -->
  <section id="tela-musica" class="tela">
    <div class="musica-wrap">
      <h2 class="titulo-tela">Escolha uma música</h2>
      <p class="subtitulo-tela">para acompanhar você pelo nosso cantinho</p>
      <div id="lista-musicas" class="lista-musicas"></div>
    </div>
  </section>


<!-- TELA: LOGIN -->
<section id="tela-login" class="tela">
  <form id="form-login" class="cartao-login" autocomplete="on">
    <div class="selo">🗝️</div>
    <h2 class="titulo-tela">A chave do cantinho</h2>
    <p class="subtitulo-tela">só nós dois sabemos entrar</p>

    <label for="login-usuario">Usuário</label>
    <input id="login-usuario" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>

    <label for="login-senha">Senha</label>
    <input id="login-senha" type="password" autocomplete="current-password" required>

    <p id="login-erro" class="login-erro" role="alert"></p>
    <button id="btn-login" class="botao" type="submit">Entrar</button>
  </form>
</section>


  <!-- TELA 3: ÁLBUM (provisória) -->
  <section id="tela-album" class="tela">
    <header class="menu">
      <button class="menu-btn ativo" data-aba="aba-timeline" type="button">Linha temporal</button>
      <button class="menu-btn" data-aba="aba-carta" type="button">Minha carta</button>
      <button id="btn-sair" class="menu-sair" type="button">Sair</button>
    </header>

<div id="aba-timeline" class="aba ativa">
  <div class="timeline-topo">
    <h2 class="titulo-tela">Nossa história</h2>
    <p class="subtitulo-tela">cada página guarda um pedacinho de nós</p>
  </div>
  <div id="timeline" class="timeline"></div>
  <div class="timeline-fim">
    <button id="btn-nova" class="botao" type="button">+ Adicionar uma nova lembrança</button>
  </div>
</div>
    <div id="aba-carta" class="aba">
      <p class="provisorio">A carta vai aparecer aqui. ✦</p>
    </div>
  </section>

  <!-- PLAYER -->
  <div id="player" class="player oculto">
    <div class="player-info">
      <span id="player-titulo" class="player-titulo">—</span>
      <span id="player-artista" class="player-artista">—</span>
    </div>
    <div class="player-botoes">
      <button id="btn-play" class="player-btn" type="button" aria-label="Pausar ou continuar">⏸</button>
      <button id="btn-trocar" class="player-btn texto" type="button">Trocar</button>
    </div>
  </div>

  <audio id="audio" loop preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/music.js"></script>
<script src="js/timeline.js"></script>
</body>
</body>
</body>
</html>
